name: interface_scan
description: "InterfaceScan - AI-Assisted UI Evaluation and Redesign Tool"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Image picking
  image_picker: ^1.1.2

  # Image processing (pure Dart, no native code needed)
  image: ^4.2.0

  # ML Kit OCR
  google_mlkit_text_recognition: ^0.14.0

  # HTTP for AI API calls
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Secure storage for API key
  flutter_secure_storage: ^9.2.4

  # JSON serialization
  json_annotation: ^4.9.0

  # UUID for session IDs
  uuid: ^4.5.1

  # File utilities
  path: ^1.9.0

  # Permission handling
  permission_handler: ^11.3.1

  # Intl for date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
